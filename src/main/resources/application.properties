spring.application.name=organizacao-academica

# Environment variables may override these defaults. Never commit database passwords.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/organizacao_academica}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate must not create or alter schema objects; Flyway owns versioned schema changes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
