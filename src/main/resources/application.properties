spring.application.name=organizacao-academica

# Environment variables may override these defaults. Never commit database passwords.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/organizacao_academica}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate must not create or alter schema objects; Flyway owns versioned schema changes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Browser authentication uses an HttpOnly session cookie. Set the secure flag in HTTPS environments.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
