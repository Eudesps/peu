spring.application.name=organizacao-academica

# Configure credentials through environment variables; never commit database passwords.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/organizacao_academica}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# No entities or migrations exist yet, so startup must not create or change schema objects.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=false
